<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg">
  <g fill="#f2e6c9" fill-opacity="0.14">

    <!-- Gear -->
    <path d="M 760.0,280.0 L 719.9,316.5 L 740.2,366.8 L 688.2,382.3 L 684.7,436.4 L 631.2,427.8 L 604.5,475.0 L 560.0,444.0 L 515.5,475.0 L 488.8,427.8 L 435.3,436.4 L 431.8,382.3 L 379.8,366.8 L 400.1,316.5 L 360.0,280.0 L 400.1,243.5 L 379.8,193.2 L 431.8,177.7 L 435.3,123.6 L 488.8,132.2 L 515.5,85.0 L 560.0,116.0 L 604.5,85.0 L 631.2,132.2 L 684.7,123.6 L 688.2,177.7 L 740.2,193.2 L 719.9,243.5 Z"/>
    <circle cx="560" cy="280" r="90" fill="none" stroke="#f2e6c9" stroke-opacity="0.14" stroke-width="24"/>

    <!-- Forklift silhouette -->
    <g transform="translate(40,140)">
      <!-- rear body / counterweight -->
      <rect x="230" y="150" width="150" height="90" rx="6"/>
      <!-- cab -->
      <path d="M 230,150 L 230,60 L 300,20 L 340,20 L 340,150 Z"/>
      <!-- overhead guard posts -->
      <rect x="235" y="20" width="12" height="130"/>
      <rect x="325" y="20" width="12" height="130"/>
      <rect x="235" y="15" width="102" height="12"/>
      <!-- mast -->
      <rect x="30" y="0" width="14" height="240"/>
      <rect x="70" y="0" width="14" height="240"/>
      <!-- carriage -->
      <rect x="24" y="150" width="66" height="16"/>
      <!-- forks -->
      <rect x="-40" y="160" width="90" height="10"/>
      <rect x="-40" y="185" width="90" height="10"/>
      <!-- front wheel -->
      <circle cx="80" cy="255" r="38"/>
      <circle cx="80" cy="255" r="14" fill="#16305c" fill-opacity="0.9"/>
      <!-- rear wheel -->
      <circle cx="330" cy="255" r="30"/>
      <circle cx="330" cy="255" r="11" fill="#16305c" fill-opacity="0.9"/>
      <!-- connecting underbody -->
      <rect x="80" y="235" width="260" height="20"/>
    </g>

  </g>
</svg>
